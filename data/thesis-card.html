<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hence thesis</title>
<style>
  /* A Hence thesis, or a list of them, drawn inside a chat (MCP Apps). Self-contained: no
     script, font, image or request leaves this page. Colours and type come from the host's
     variables, with fallbacks for a host that sends none. */
  :root {
    color-scheme: light dark;
    --bg: var(--color-background-primary, light-dark(#ffffff, #0e0f12));
    --bg-2: var(--color-background-secondary, light-dark(#f5f5f6, #16171b));
    --text: var(--color-text-primary, light-dark(#111114, #f3f3f4));
    --dim: var(--color-text-secondary, light-dark(#5c5c66, #9a9aa2));
    --line: var(--color-border-primary, light-dark(rgba(0,0,0,.12), rgba(255,255,255,.12)));
    --up: var(--color-text-success, light-dark(#147a45, #5fcf91));
    --down: var(--color-text-danger, light-dark(#b3382c, #f08d83));
    --warn: var(--color-text-warning, light-dark(#8a5a00, #f4c39a));
    --radius: var(--border-radius-md, 10px);
    font-family: var(--font-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; color: var(--text); }
  /* The host sizes the frame to the height this page reports. A scrollbar here would take width,
     reflow the text taller and never go away; it stays scrollable for a host that does not resize. */
  html { scrollbar-width: none; }
  html::-webkit-scrollbar { display: none; }
  body { padding: 2px; font-size: 13.5px; line-height: 1.45; }
  .card { border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); padding: 16px; overflow-wrap: anywhere; }
  .card + .card { margin-top: 10px; }
  .eyebrow { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); margin-bottom: 6px; }
  h1 { font-size: 17px; line-height: 1.3; margin: 0 0 4px; font-weight: 600; }
  h2 { font-size: 14px; line-height: 1.35; margin: 0 0 2px; font-weight: 600; }
  .by { color: var(--dim); font-size: 12.5px; margin-bottom: 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; }
  .chip { font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--dim); }
  p { margin: 0 0 12px; }
  .label { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); margin: 14px 0 6px; }
  .row { display: grid; grid-template-columns: minmax(84px, 1.2fr) 44px 3fr 48px; gap: 8px; align-items: center; padding: 4px 0; font-size: 12.5px; }
  .sym { font-weight: 600; }
  .side.long { color: var(--up); } .side.short { color: var(--down); }
  .bar { height: 6px; border-radius: 3px; background: var(--bg-2); overflow: hidden; }
  .bar > span { display: block; height: 100%; border-radius: 3px; background: var(--up); }
  .bar.short > span { background: var(--down); }
  .w { text-align: right; font-variant-numeric: tabular-nums; color: var(--dim); }
  .figs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .fig { background: var(--bg-2); border-radius: 8px; padding: 8px 10px; }
  .fig b { display: block; font-size: 15px; font-variant-numeric: tabular-nums; font-weight: 600; }
  .fig span { font-size: 11px; color: var(--dim); }
  .pos { color: var(--up); } .neg { color: var(--down); } .na { color: var(--dim); }
  .small { font-size: 11.5px; color: var(--dim); margin: 8px 0 0; }
  .warnline { font-size: 12px; color: var(--warn); margin: 8px 0 0; }
  ul { margin: 0; padding-left: 16px; } li { margin: 0 0 4px; font-size: 12.5px; }
  .open { display: inline-block; margin-top: 14px; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg-2);
          color: var(--text); font: inherit; font-weight: 600; font-size: 12.5px; text-decoration: none; cursor: pointer; }
  .item { padding: 12px 0; border-top: 1px solid var(--line); }
  .item:first-of-type { border-top: none; padding-top: 0; }
  .item p { margin: 4px 0 6px; color: var(--dim); font-size: 12.5px; }
  .item .open { margin-top: 4px; padding: 4px 10px; font-size: 12px; }
  .state { color: var(--dim); }
  @media (max-width: 420px) { .figs { grid-template-columns: 1fr 1fr; } .row { grid-template-columns: minmax(70px, 1.2fr) 40px 2fr 44px; } }
</style>
</head>
<body>
<div id="root"><div class="card state" id="waiting">Reading Hence…</div></div>
<script>
(function () {
  'use strict';
  /* The view's half of the MCP Apps protocol (JSON-RPC over postMessage), with no library.
     Everything shown is put on the page as text, never as markup: thesis text is written by
     Hence users. A figure that was not read is shown as "n/a", never as zero. */
  var root = document.getElementById('root');
  var nextId = 1, waiting = {}, canOpen = false;

  function post(message) { window.parent.postMessage(message, '*'); }
  function request(method, params) {
    var id = nextId++;
    return new Promise(function (resolve, reject) {
      waiting[id] = { resolve: resolve, reject: reject };
      post({ jsonrpc: '2.0', id: id, method: method, params: params || {} });
    });
  }
  function notify(method, params) { post({ jsonrpc: '2.0', method: method, params: params || {} }); }

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined && text !== null) node.textContent = String(text);
    return node;
  }
  function isNum(v) { return typeof v === 'number' && isFinite(v); }
  function pct(v) { return isNum(v) ? (v > 0 ? '+' : '') + v.toFixed(2) + '%' : 'n/a'; }
  function tone(v) { return isNum(v) ? (v > 0 ? 'pos' : v < 0 ? 'neg' : '') : 'na'; }
  function hence(url) { return typeof url === 'string' && /^https:\/\/[^\s"'<>]+$/.test(url) ? url : null; }

  function openButton(url, label) {
    var safe = hence(url);
    if (!safe) return null;
    var a = el('a', 'open', label || 'Open in Hence');
    a.href = safe; a.target = '_blank'; a.rel = 'noopener noreferrer';
    a.addEventListener('click', function (ev) {
      if (!canOpen) return;                       // no host support: the plain link does it
      ev.preventDefault();
      request('ui/open-link', { url: safe }).catch(function () { window.open(safe, '_blank', 'noopener'); });
    });
    return a;
  }

  function holdings(card, list, cash) {
    card.appendChild(el('div', 'label', 'Holdings'));
    list.forEach(function (h) {
      if (!h || typeof h !== 'object') return;
      var row = el('div', 'row');
      row.appendChild(el('span', 'sym', h.symbol || h.market_id || 'n/a'));
      row.appendChild(el('span', 'side ' + (h.side === 'short' ? 'short' : 'long'), h.side || 'n/a'));
      var bar = el('div', 'bar' + (h.side === 'short' ? ' short' : '')), fill = el('span');
      fill.style.width = (isNum(h.weight_pct) ? Math.max(0, Math.min(100, h.weight_pct)) : 0) + '%';
      bar.appendChild(fill); row.appendChild(bar);
      row.appendChild(el('span', 'w', isNum(h.weight_pct) ? h.weight_pct.toFixed(h.weight_pct % 1 ? 1 : 0) + '%' : 'n/a'));
      card.appendChild(row);
    });
    if (isNum(cash) && cash > 0) {
      var row = el('div', 'row');
      row.appendChild(el('span', 'sym', 'Cash')); row.appendChild(el('span', 'side', ''));
      row.appendChild(el('div', 'bar')); row.appendChild(el('span', 'w', cash.toFixed(cash % 1 ? 1 : 0) + '%'));
      card.appendChild(row);
    }
  }

  function performance(card, t) {
    var p = t.performance;
    card.appendChild(el('div', 'label', 'Hypothetical price history' + (p && isNum(p.period_days) ? ', ' + p.period_days + ' days' : '')));
    if (!p || typeof p !== 'object') {
      // not read is not flat: say so, and say why when Hence did
      // Hence's sentence carries an instruction for the model after its first full stop; a person is shown the reason only
      var why = typeof t.performance_unavailable === 'string' ? t.performance_unavailable.split('. Do not')[0].replace(/\.$/, '') : '';
      card.appendChild(el('div', 'warnline', (why || 'The price history could not be read') + '. No return is shown.'));
      return;
    }
    var figs = el('div', 'figs');
    [['This basket', p.return_pct], [p.benchmark || 'Benchmark', p.benchmark_return_pct], ['Worst drop', p.max_drawdown_pct]].forEach(function (f) {
      var box = el('div', 'fig'), value = el('b', tone(f[1]), pct(f[1]));
      box.appendChild(value); box.appendChild(el('span', '', f[0])); figs.appendChild(box);
    });
    card.appendChild(figs);
    if (p.complete !== true) {
      card.appendChild(el('div', 'warnline', 'Incomplete: ' + (isNum(p.holdings_left_out) ? p.holdings_left_out : 'some') + ' holdings have no price history and are left out.'));
    }
    card.appendChild(el('div', 'small', (p.from && p.to ? p.from + ' to ' + p.to + '. ' : '') + 'Before costs. Not a live track record.'));
  }

  function thesis(t) {
    var card = el('div', 'card');
    card.appendChild(el('div', 'eyebrow', 'Hence thesis'));
    card.appendChild(el('h1', '', t.title || 'Untitled thesis'));
    card.appendChild(el('div', 'by', [t.author, t.topic, isNum(t.horizon_days) ? t.horizon_days + ' days' : null].filter(Boolean).join(' · ')));
    var chips = [];
    if (t.visibility) chips.push(t.visibility);
    if (t.status) chips.push(t.status);
    if (t.yours === true) chips.push('yours');
    if (t.research_in_progress === true) chips.push('research in progress');
    if (chips.length) { var c = el('div', 'chips'); chips.forEach(function (x) { c.appendChild(el('span', 'chip', x)); }); card.appendChild(c); }
    if (t.summary) card.appendChild(el('p', '', t.summary));
    if (Array.isArray(t.holdings) && t.holdings.length) holdings(card, t.holdings, t.cash_weight_pct);
    if ('performance' in t) performance(card, t);
    if (t.invalidation) { card.appendChild(el('div', 'label', 'Wrong if')); card.appendChild(el('p', '', t.invalidation)); }
    if (Array.isArray(t.checkpoints) && t.checkpoints.length) {
      card.appendChild(el('div', 'label', 'Checkpoints'));
      var ul = el('ul');
      t.checkpoints.slice(0, 3).forEach(function (c) { if (c && c.observable) ul.appendChild(el('li', '', (c.by ? c.by + ': ' : '') + c.observable)); });
      card.appendChild(ul);
    }
    var button = openButton(t.url, 'Review and trade in Hence');
    if (button) card.appendChild(button);
    card.appendChild(el('div', 'small', t.text_origin || 'Written by Hence users and the Hence research pipeline.'));
    return card;
  }

  function list(value) {
    var card = el('div', 'card');
    card.appendChild(el('div', 'eyebrow', value.edition ? 'Hence, featured ' + value.edition : value.which ? 'Your Hence theses' : 'Hence theses'));
    var rows = value.theses.filter(function (t) { return t && typeof t === 'object'; });
    if (!rows.length) card.appendChild(el('div', 'state', 'No theses in this list.'));
    rows.forEach(function (t) {
      var item = el('div', 'item');
      item.appendChild(el('h2', '', t.title || 'Untitled thesis'));
      var meta = [t.author, t.topic];
      if (t.visibility) meta.push(t.visibility);
      if ('return_1m_pct' in t) meta.push('1 month ' + pct(t.return_1m_pct));
      item.appendChild(el('div', 'by', meta.filter(Boolean).join(' · ')));
      if (t.summary) item.appendChild(el('p', '', t.summary));
      var button = openButton(t.url, 'Open');
      if (button) item.appendChild(button);
      card.appendChild(item);
    });
    if (value.unread_note) card.appendChild(el('div', 'warnline', value.unread_note));
    if (value.note) card.appendChild(el('div', 'small', value.note));
    return card;
  }

  // The host sizes the frame from this. Said after every draw, not only when a ResizeObserver
  // fires: a frame that is not being painted yet delivers no resize, and the card would stay
  // at its first height, cut off.
  function reportSize() {
    var box = document.body.getBoundingClientRect();
    notify('ui/notifications/size-changed', { width: Math.ceil(box.width), height: Math.ceil(box.height) });
  }
  function show(node) { root.textContent = ''; root.appendChild(node); reportSize(); }

  function render(result) {
    if (!result || typeof result !== 'object') return;
    var value = result.structuredContent;
    if (result.isError || !value || typeof value !== 'object') {
      // the tool said it could not do it: show its sentence, never an empty card that looks like "nothing found"
      var text = Array.isArray(result.content) ? result.content.map(function (c) { return c && c.type === 'text' ? c.text : ''; }).join(' ').trim() : '';
      show(el('div', 'card state', text || 'Hence could not answer. Nothing is shown.'));
      return;
    }
    if (Array.isArray(value.theses)) show(list(value));
    else if (Array.isArray(value.holdings) || value.title) show(thesis(value));
    else show(el('div', 'card state', 'Nothing to show for this answer.'));
  }

  function applyContext(context) {
    if (!context || typeof context !== 'object') return;
    var vars = context.styles && context.styles.variables;
    if (vars && typeof vars === 'object') {
      Object.keys(vars).forEach(function (name) {
        if (/^--[a-z0-9-]+$/i.test(name) && typeof vars[name] === 'string') document.documentElement.style.setProperty(name, vars[name]);
      });
    }
    if (context.theme === 'light' || context.theme === 'dark') document.documentElement.style.colorScheme = context.theme;
  }

  window.addEventListener('message', function (event) {
    if (event.source !== window.parent) return;
    var m = event.data;
    if (!m || m.jsonrpc !== '2.0') return;
    if (m.id !== undefined && m.method === undefined) {
      var w = waiting[m.id];
      if (w) { delete waiting[m.id]; if (m.error) w.reject(m.error); else w.resolve(m.result); }
      return;
    }
    if (m.method === 'ui/notifications/tool-result') render(m.params);
    else if (m.method === 'ui/notifications/host-context-changed') applyContext(m.params);
    else if ((m.method === 'ui/resource-teardown' || m.method === 'ping') && m.id !== undefined) post({ jsonrpc: '2.0', id: m.id, result: {} });
  });

  if (window.ResizeObserver) {
    // the body's own height, not the document's: the document is never shorter than the frame,
    // so a card that got smaller would otherwise keep its old height
    new ResizeObserver(reportSize).observe(document.body);
  }

  request('ui/initialize', { protocolVersion: '2026-01-26', clientInfo: { name: 'hence-thesis-card', version: '1' }, appCapabilities: {}, capabilities: {} })
    .then(function (r) {
      applyContext(r && r.hostContext);
      canOpen = !!(r && r.hostCapabilities && r.hostCapabilities.openLinks);
    }, function () { /* a host that refuses still gets a working card with plain links */ })
    .then(function () { notify('ui/notifications/initialized'); });
})();
</script>
</body>
</html>
