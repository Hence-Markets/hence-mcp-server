# Packaging for the `hence` command only (hence_cli/). The MCP server (gateway/) is not a
# package: it runs from this repository or from its container image.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hence-cli"
version = "0.1.0"
description = "Hence from a terminal: public theses, tradable markets, and your account. A client of the Hence MCP server."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
hence = "hence_cli.main:main"

[tool.setuptools]
packages = ["hence_cli"]
